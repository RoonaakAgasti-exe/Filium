services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: filium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./db/migrations:/migrations:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/filium
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-moonshotai/kimi-k3-free}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      HF_HOME: /cache/huggingface
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_DATA_URL: ${ALPACA_DATA_URL:-https://data.alpaca.markets}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      LIVE_QUOTES: ${LIVE_QUOTES:-1}
      QUOTE_CACHE_TTL_SECONDS: ${QUOTE_CACHE_TTL_SECONDS:-60}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      FMP_API_KEY: ${FMP_API_KEY}
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-Filium dev dev@example.com}
      STARTING_CASH: ${STARTING_CASH:-100000}

    volumes:
      - hfcache:/cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/filium
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_DATA_URL: ${ALPACA_DATA_URL:-https://data.alpaca.markets}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      FMP_API_KEY: ${FMP_API_KEY}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      SCHEDULER_RUN_SENTIMENT: ${SCHEDULER_RUN_SENTIMENT:-1}
      SCHEDULER_HOUR: ${SCHEDULER_HOUR:-6}
      SCHEDULER_PRICE_DAYS: ${SCHEDULER_PRICE_DAYS:-7}
      SCHEDULER_NEWS_DAYS: ${SCHEDULER_NEWS_DAYS:-3}
      HF_HOME: /cache/huggingface
    volumes:
      - hfcache:/cache/huggingface
      - checkpoints:/app/ml/checkpoints

volumes:
  pgdata:
  hfcache:
  checkpoints: