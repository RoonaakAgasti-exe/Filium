server {
    listen 80;
    # Also bind IPv6. The container's /etc/hosts maps `localhost` to ::1
    # as well as 127.0.0.1, and BusyBox wget tries ::1 first — so an
    # IPv4-only listener answers every real request fine while the
    # container healthcheck fails forever with "connection refused".
    # That reads as a broken frontend in `docker compose ps` and makes
    # `docker compose up --wait` hang until it times out.
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API through the same origin the app is served from.
    #
    # This is what makes the default deployment work at all. Previously the
    # bundle called http://localhost:8000 directly, which is a cross-origin
    # request from http://localhost — blocked by the browser unless the
    # backend sends CORS headers, and broken outright for any visitor who
    # isn't on the Docker host (their "localhost" is their own machine).
    # Same-origin /api sidesteps both problems, and means VITE_API_BASE_URL
    # no longer has to be known at build time.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # RAG answers wait on an embedding call plus an LLM completion;
        # the 60s default closes the connection before a slow one returns.
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
    }

    # React Router uses client-side routing — any path that isn't a real
    # file must still serve index.html, or refreshing on /portfolio
    # returns nginx's 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
